name: Release

on:
  push:
    tags: ["*"]

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i -E 's/"version-name": "[^"]*"/"version-name": "'"$VER"'"/' metadata.json
          sed -i -E 's/"version": [0-9]+/"version": '"$(echo "$VER" | tr -d '.')"'/' metadata.json

      - name: Pack extension
        run: |
          mkdir -p dist
          zip -r "dist/ringlight@danielgenezini.shell-extension.zip" \
            metadata.json extension.js prefs.js schemas/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/ringlight@danielgenezini.shell-extension.zip" --generate-notes
