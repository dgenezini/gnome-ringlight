name: Release

on:
  push:
    tags: ["*"]

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '."version-name" = $v' metadata.json > metadata.json.tmp
          mv metadata.json.tmp metadata.json

      - name: Pack extension
        run: |
          mkdir -p dist
          zip -r "dist/ringlight@danielgenezini.shell-extension.zip" \
            metadata.json extension.js prefs.js schemas/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/ringlight@danielgenezini.shell-extension.zip" --generate-notes
