name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNOME 46
          - runner: ubuntu-24.04
          # GNOME 50
          - runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install GNOME Shell and glib tools
        run: sudo apt-get update && sudo apt-get install -y gnome-shell dbus libglib2.0-bin
      - name: Unit suite
        run: node --test tests/extension.test.mjs
      - name: Headless shell integration suite
        run: node tests/headless/run.mjs
